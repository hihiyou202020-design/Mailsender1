<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2481cc; --bg: #0e1621; --card: #1c2732; --text: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        .header { background: linear-gradient(180deg, #2481cc, #165b91); padding: 30px 20px; text-align: center; border-radius: 0 0 30px 30px; }
        .balance-card { display: flex; background: var(--card); margin: -20px 20px 20px; padding: 20px; border-radius: 20px; justify-content: space-around; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .bal-box { text-align: center; }
        .bal-box span { font-size: 11px; color: #8e97a1; text-transform: uppercase; }
        .bal-box b { display: block; font-size: 20px; margin-top: 5px; }
        .section-title { padding: 10px 25px; font-size: 14px; color: #8e97a1; text-transform: uppercase; }
        .offer-card { background: var(--card); margin: 0 20px 10px; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
        .buy-btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h2 id="user-name">Premium Store</h2>
</div>

<div class="balance-card">
    <div class="bal-box"><span>Diamonds</span><b id="stat-diamonds" style="color:#00d4ff">0</b></div>
    <div class="bal-box"><span>Mail Credits</span><b id="stat-mails">0</b></div>
</div>

<div class="section-title">💎 Diamond Refill</div>
<div id="diamond-shop"></div>

<div class="section-title">📧 Mail Offers</div>
<div id="mail-shop"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ১. আপনার Ngrok URL এখানে দিন (সবচেয়ে গুরুত্বপূর্ণ)
    const API_URL = "https://your-ngrok-url.ngrok-free.app/get-invoice";

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id');
    document.getElementById('stat-diamonds').innerText = urlParams.get('diamonds') || '0';
    document.getElementById('stat-mails').innerText = urlParams.get('mails') || '0';
    document.getElementById('user-name').innerText = tg.initDataUnsafe?.user?.first_name || "Store";

    // অফার জেনারেট করা
    function loadOffers() {
        const dList = document.getElementById('diamond-shop');
        for (let d = 25; d <= 200; d += 25) {
            let stars = Math.floor(d * 1.28);
            dList.innerHTML += `<div class="offer-card"><div><b>${d} Diamonds</b><br><small>⭐️ ${stars} Stars</small></div><button class="buy-btn" onclick="purchase('buy_diamond', ${d}, ${stars})">Buy</button></div>`;
        }

        const mList = document.getElementById('mail-shop');
        const mOff = [{m:40,d:25}, {m:85,d:50}, {m:130,d:75}, {m:170,d:100}, {m:330,d:200}];
        mOff.forEach(o => {
            mList.innerHTML += `<div class="offer-card"><div><b>${o.m} Mails</b><br><small>💎 ${o.d} Diamonds</small></div><button class="buy-btn" onclick="purchase('buy_mail', ${o.m}, ${o.d})">Buy</button></div>`;
        });
    }
    loadOffers();

    async function purchase(type, amt, price) {
        tg.showConfirm(`আপনি কি এটি কিনতে চান?`, async (confirmed) => {
            if (confirmed) {
                tg.MainButton.setText("Processing...").show();
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId, amount: amt, cost: price, action: type })
                    });
                    const res = await response.json();
                    if (res.ok) {
                        // ইন-অ্যাপ পেমেন্ট উইন্ডো খোলা
                        tg.openInvoice(res.invoice_link, (status) => {
                            if (status === 'paid') {
                                tg.showAlert("✅ পেমেন্ট সফল!");
                                location.reload();
                            }
                        });
                    }
                } catch (e) {
                    tg.showAlert("Server Error! নিশ্চিত করুন Ngrok সচল আছে।");
                } finally {
                    tg.MainButton.hide();
                }
            }
        });
    }
</script>
</body>
</html>
