<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Diamond Shop - Premium HTML Mail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Section */
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 3em;
            margin-bottom: 10px;
        }

        h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        /* User Info */
        .user-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            color: white;
            text-align: center;
        }

        .diamond-balance {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .diamond-balance span {
            font-size: 1.5em;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .product-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .product-cost {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .product-value {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 15px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .buy-btn:hover {
            transform: scale(1.05);
        }

        /* Messages */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .message.success {
            background: #4caf50;
        }

        .message.error {
            background: #f44336;
        }

        .message.info {
            background: #2196f3;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Loading Overlay */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">💎</div>
            <h1>Diamond Shop</h1>
            <p class="subtitle">Premium HTML Mail Service</p>
        </div>

        <div class="user-info">
            <div>Welcome, <span id="username">User</span></div>
            <div class="diamond-balance">
                💎 <span id="diamondBalance">0</span>
            </div>
            <div>Your Balance</div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('diamonds')">Buy Diamonds ⭐</button>
            <button class="tab" onclick="switchTab('mail')">Buy HTML Mail 💌</button>
        </div>

        <div id="diamondsTab" class="products-grid">
            <!-- Diamond offers will be dynamically loaded -->
        </div>

        <div id="mailTab" class="products-grid" style="display: none;">
            <!-- Mail offers will be dynamically loaded -->
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <script>
        // Get Telegram WebApp data
        let tg = window.Telegram.WebApp;
        let user = tg.initDataUnsafe?.user;
        let userId = user?.id || Math.floor(Math.random() * 1000000);
        let username = user?.username || user?.first_name || 'Guest';

        document.getElementById('username').textContent = username;

        // API Configuration
        const API_URL = 'https://your-bot-domain.com'; // Replace with your bot's domain
        // For local testing, you can use: const API_URL = 'http://localhost:8000';

        // Generate diamond offers (32⭐ = 25💎 up to 500💎)
        function generateDiamondOffers() {
            const offers = [];
            for (let diamonds = 25; diamonds <= 500; diamonds += 25) {
                const stars = Math.ceil((diamonds * 32) / 25);
                offers.push({
                    diamonds: diamonds,
                    stars: stars,
                    price: stars
                });
            }
            return offers;
        }

        // Generate mail offers (25💎 = 40 mails up to 500💎)
        function generateMailOffers() {
            const offers = [];
            for (let diamonds = 25; diamonds <= 500; diamonds += 25) {
                let mails;
                if (diamonds === 25) mails = 40;
                else if (diamonds === 50) mails = 85;
                else if (diamonds === 75) mails = 130;
                else if (diamonds === 100) mails = 170;
                else if (diamonds === 125) mails = 210;
                else if (diamonds === 150) mails = 250;
                else if (diamonds === 175) mails = 290;
                else if (diamonds === 200) mails = 330;
                else {
                    // For higher values: ~1.65 mails per diamond
                    mails = Math.floor(diamonds * 1.65);
                }
                offers.push({
                    diamonds: diamonds,
                    mails: mails,
                    cost: diamonds
                });
            }
            return offers;
        }

        // Display diamond offers
        function displayDiamondOffers() {
            const container = document.getElementById('diamondsTab');
            const offers = generateDiamondOffers();
            
            container.innerHTML = offers.map(offer => `
                <div class="product-card">
                    <div class="product-icon">⭐</div>
                    <div class="product-cost">${offer.stars} Stars</div>
                    <div class="product-value">Get ${offer.diamonds} 💎</div>
                    <button class="buy-btn" onclick="buyDiamonds(${offer.diamonds}, ${offer.stars})">
                        Buy Now
                    </button>
                </div>
            `).join('');
        }

        // Display mail offers
        function displayMailOffers() {
            const container = document.getElementById('mailTab');
            const offers = generateMailOffers();
            
            container.innerHTML = offers.map(offer => `
                <div class="product-card">
                    <div class="product-icon">📧</div>
                    <div class="product-cost">${offer.diamonds} 💎</div>
                    <div class="product-value">Get ${offer.mails} HTML Mails</div>
                    <button class="buy-btn" onclick="buyMails(${offer.diamonds}, ${offer.mails})">
                        Purchase
                    </button>
                </div>
            `).join('');
        }

        // Buy diamonds with Telegram Stars
        async function buyDiamonds(diamonds, stars) {
            showLoading(true);
            
            try {
                // Initialize Telegram Stars payment
                const response = await fetch(`${API_URL}/create-star-invoice`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        diamonds: diamonds,
                        stars: stars,
                        username: username
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.invoice_link) {
                    // Open invoice link in Telegram
                    tg.openInvoice(data.invoice_link, (status) => {
                        if (status === 'paid') {
                            showMessage('Payment successful! Diamonds added to your account.', 'success');
                            loadUserBalance();
                        } else {
                            showMessage('Payment cancelled or failed.', 'error');
                        }
                    });
                } else {
                    showMessage('Failed to create invoice. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Network error. Please try again.', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Buy HTML mails with diamonds
        async function buyMails(diamonds, mails) {
            showLoading(true);
            
            try {
                const response = await fetch(`${API_URL}/purchase-mails`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        diamonds: diamonds,
                        mails: mails,
                        username: username
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`Successfully purchased ${mails} HTML mails!`, 'success');
                    loadUserBalance();
                } else {
                    showMessage(data.message || 'Insufficient diamonds!', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Network error. Please try again.', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Load user's diamond balance
        async function loadUserBalance() {
            try {
                const response = await fetch(`${API_URL}/get-balance?user_id=${userId}`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('diamondBalance').textContent = data.balance || 0;
                }
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        // Switch between tabs
        function switchTab(tab) {
            const diamondsTab = document.getElementById('diamondsTab');
            const mailTab = document.getElementById('mailTab');
            const tabs = document.querySelectorAll('.tab');
            
            tabs.forEach(t => t.classList.remove('active'));
            
            if (tab === 'diamonds') {
                diamondsTab.style.display = 'grid';
                mailTab.style.display = 'none';
                tabs[0].classList.add('active');
            } else {
                diamondsTab.style.display = 'none';
                mailTab.style.display = 'grid';
                tabs[1].classList.add('active');
            }
        }

        // Show message
        function showMessage(text, type) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 3000);
        }

        // Show/hide loading
        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) {
                loading.classList.add('active');
            } else {
                loading.classList.remove('active');
            }
        }

        // Initialize app
        function init() {
            displayDiamondOffers();
            displayMailOffers();
            loadUserBalance();
            
            // Expand Telegram WebApp
            tg.expand();
            tg.ready();
        }

        // Start the app
        init();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
